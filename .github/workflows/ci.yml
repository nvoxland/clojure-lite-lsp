name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to a branch replaces its run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1645
          clj-kondo: 2026.05.25

      - name: Cache Maven and git deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-lint-${{ hashFiles('deps.edn') }}
          restore-keys: clojure-lint-

      - name: clj-kondo
        run: clj-kondo --lint src test --fail-level warning

      - name: cljfmt
        run: clojure -Sdeps '{:deps {dev.weavejester/cljfmt {:mvn/version "0.13.1"}}}' -M -m cljfmt.main check src test

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1645

      - name: Cache Maven and git deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-test-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clojure-test-${{ runner.os }}-

      - name: Run tests
        run: clojure -M:test

  native:
    name: Native binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1645

      - name: Cache Maven and git deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-native-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clojure-native-${{ runner.os }}-

      # a reflective call compiles, then fails at runtime in the native binary
      - name: Build
        run: |
          bin/build-native 2>&1 | tee build.log
          if grep -q "Reflection warning" build.log; then
            grep "Reflection warning" build.log
            exit 1
          fi

      - name: Smoke test
        env:
          CLOJURE_LITE_LSP_HOME: ${{ runner.temp }}/clojure-lite-lsp-home
        run: |
          bin=target/clojure-lite-lsp
          $bin version
          # indexes this repository with the native daemon, then answers
          $bin query definition clojure-lite-lsp.query/definition --project . | tee query.out
          grep -q "src/clojure_lite_lsp/query.clj" query.out
          $bin stop
          # the language server answers initialize
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
          printf 'Content-Length: %d\r\n\r\n%s' "${#body}" "$body" | $bin lsp | tee lsp.out || true
          grep -q '"capabilities"' lsp.out

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: npm ci
      - run: npm test

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zed
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zed/target
          key: cargo-${{ hashFiles('zed/Cargo.lock') }}
          restore-keys: cargo-

      - run: cargo test
