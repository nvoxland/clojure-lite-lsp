[project]
name = "clojure-lite-lsp-docs"
version = "0.0.0"
description = "Documentation site for clojure-lite-lsp"
authors = [{ name = "Nathan Voxland", email = "nathan@voxland.net" }]
requires-python = ">=3.11,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# click<8.3: newer click breaks mkdocs serve's auto-reload
click = "<8.3.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
pymdown-extensions = "^10.0"
mkdocs-autorefs = "^1.4.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
