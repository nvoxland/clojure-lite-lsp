site_name: clojure-lite-lsp
site_description: A Clojure language server small enough to run in every project and worktree, for reading and reviewing code
site_author: Nathan Voxland
site_url: https://nvoxland.github.io/clojure-lite-lsp/
repo_name: nvoxland/clojure-lite-lsp
repo_url: https://github.com/nvoxland/clojure-lite-lsp
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
dev_addr: '127.0.0.1:8000'
# the theme overrides (the home page) reload the preview too
watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Agents:
          - Overview: getting-started/agents/index.md
          - Claude Code: getting-started/agents/claude-code.md
          - Codex: getting-started/agents/codex.md
      - Editors:
          - VS Code: getting-started/editors/vscode.md
          - Zed: getting-started/editors/zed.md
          - Other editors: getting-started/editors/other.md
  - Why: why.md
  - Guide:
      - CLI: guide/cli.md
      - Query commands: guide/query.md
      - Configuration: guide/configuration.md
      - Language server: guide/lsp.md
      - MCP: guide/mcp.md
      - Troubleshooting: guide/troubleshooting.md
  - Architecture: architecture.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - autorefs

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nvoxland/clojure-lite-lsp

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Nathan Voxland
